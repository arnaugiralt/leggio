# The same checks Workers Builds runs before a deploy, so a pull request shows them too.
name: check
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: bash scripts/check-core-types.sh
      - run: node scripts/check-core-pack.mjs
      - run: pnpm --filter leggio build
      # Catches manifest errors on every push.
      - run: cd packages/vscode && pnpm dlx @vscode/vsce@4.1.0 package --no-dependencies --out "$RUNNER_TEMP/leggio.vsix"
