# A core release is a core-vX.Y.Z tag on a commit that is on master, with the same version in
# packages/core/package.json. The tag runs the checks, publishes @leggio/core to npm, then publishes a GitHub
# release. It never touches the site: release.yml owns the vX.Y.Z tags, and neither filter matches the other's.
# npm trusted publishing (OIDC) signs the publish, so the repository holds no npm token. The first version was
# published by hand. npm needs a trusted publisher set up for the package: repository arnaugiralt/leggio,
# workflow release-core.yml. Push one tag at a time: GitHub sends no event for more than three tags in one push.
name: release-core
on:
  push:
    tags: ['core-v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
concurrency: release-core
jobs:
  # The same checks as check.yml, first: a commit that fails them gets neither a publish nor a release.
  check:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: bash scripts/check-core-types.sh
      - run: node scripts/check-core-pack.mjs
  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing exchanges this OIDC token for a publish token
    steps:
      # Actions are pinned to commits: this job can publish to npm.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # all history and tags: the master check needs them
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # The tag reaches the scripts only as $GITHUB_REF_NAME, never pasted into them, so its characters can't run.
      - name: Publish to npm
        shell: bash
        run: |
          tag=$GITHUB_REF_NAME
          [[ $tag =~ ^core-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$tag is not a core release tag (core-vX.Y.Z)"; exit 1; }
          sha=$(git rev-parse "$tag^{commit}")
          git merge-base --is-ancestor "$sha" origin/master || { echo "::error::$tag is not on master"; exit 1; }
          version=$(node -p "require('./packages/core/package.json').version")
          [ "core-v$version" = "$tag" ] || { echo "::error::$tag does not match version $version in packages/core/package.json"; exit 1; }
          # A re-run after a publish that worked must not fail on npm's "already published" error. npm view
          # exits non-zero for a missing version, but for other failures too (network, registry down), so a
          # failure here counts as "not published" and the publish below reports the real error.
          if npm view "@leggio/core@$version" version >/dev/null 2>&1; then
            echo "::notice::@leggio/core@$version is already on npm, skipping the publish"
            exit 0
          fi
          # Trusted publishing needs npm 11.5.1 or later, and node 24 ships an older one. Pinned: this job can publish.
          npm install -g npm@11.21.1
          cd packages/core
          tarball=$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -n 1)
          npm publish "$tarball" --access public --provenance
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # all history and tags: the notes need them
      - name: Publish the GitHub release
        shell: bash # -eo pipefail: a failing git command stops the step instead of publishing empty notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already has a release"; exit 0; fi
          version=${tag#core-v}
          bash scripts/core-release-notes.sh "$tag" > "$RUNNER_TEMP/notes.md"
          # Pre-release while the version is 0.x (alpha).
          gh release create "$tag" --verify-tag --title "@leggio/core $version" --notes-file "$RUNNER_TEMP/notes.md" $([[ $tag == core-v0.* ]] && echo --prerelease)
