# A VS Code release is a vscode-vX.Y.Z tag on a commit that is on master, with the same version in
# packages/vscode/package.json. The tag runs the checks, publishes the extension to the VS Code Marketplace and
# to Open VSX, then publishes a GitHub release with the .vsix attached. It never touches the site or npm:
# release.yml owns the vX.Y.Z tags and release-core.yml the core-vX.Y.Z tags, and no filter matches another's.
# Both registries use trusted publishing (GitHub OIDC, no stored token). Each needs a trusted publisher for repo
# arnaugiralt/leggio and workflow release-vscode.yml: on the Marketplace for publisher arnaugiralt, and on Open VSX
# for namespace arnaugiralt. An OVSX_PAT secret, if set, makes ovsx use it instead of OIDC.
# Open VSX runs only when the repository variable OPEN_VSX is "on". To publish a version that skipped it, set the
# variable and re-run the tag's workflow: the Marketplace skips a version it has and the GitHub release is kept. Push one tag at a time: GitHub sends no event
# for more than three tags in one push.
name: release-vscode
on:
  push:
    tags: ['vscode-v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
concurrency: release-vscode
jobs:
  # The same checks as check.yml, first: a commit that fails them gets neither a publish nor a release.
  check:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter leggio build
      - run: cd packages/vscode && pnpm dlx @vscode/vsce@4.1.0 package --no-dependencies --out "$RUNNER_TEMP/leggio.vsix"
  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing to both registries
    steps:
      # Actions are pinned to commits: this job can publish to both registries.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false # dlx code in this job must not find the token in .git/config
          fetch-depth: 0 # all history and tags: the master check needs them
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tag reaches the script only as $GITHUB_REF_NAME, never pasted into it, so its characters can't run.
      - name: Check the tag, build and package
        id: package
        shell: bash
        run: |
          tag=$GITHUB_REF_NAME
          [[ $tag =~ ^vscode-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$tag is not a VS Code release tag (vscode-vX.Y.Z)"; exit 1; }
          sha=$(git rev-parse "$tag^{commit}")
          git merge-base --is-ancestor "$sha" origin/master || { echo "::error::$tag is not on master"; exit 1; }
          version=$(node -p "require('./packages/vscode/package.json').version")
          [ "vscode-v$version" = "$tag" ] || { echo "::error::$tag does not match version $version in packages/vscode/package.json"; exit 1; }
          pnpm --filter leggio build
          vsix="$RUNNER_TEMP/leggio-$version.vsix"
          (cd packages/vscode && pnpm dlx @vscode/vsce@4.1.0 package --no-dependencies --out "$vsix")
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"
      # --skip-duplicate lets a re-run after a partial publish pass: a registry that has this version is skipped.
      - name: Publish to the Marketplace
        working-directory: packages/vscode
        env:
          VSIX: ${{ steps.package.outputs.vsix }}
        run: pnpm dlx @vscode/vsce@4.1.0 publish --oidc --no-dependencies --skip-duplicate --packagePath "$VSIX"
      # With no OVSX_PAT, ovsx exchanges the job's OIDC token. The secret stays only as a fallback, in this step alone.
      - name: Publish to Open VSX
        if: ${{ vars.OPEN_VSX == 'on' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: ${{ steps.package.outputs.vsix }}
        run: pnpm dlx ovsx@1.3.0 publish "$VSIX" --skip-duplicate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vsix
          path: ${{ runner.temp }}/leggio-*.vsix
          if-no-files-found: error
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # all history and tags: the notes need them
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vsix
          path: ${{ runner.temp }}/vsix
      - name: Publish the GitHub release
        shell: bash # -eo pipefail: a failing git command stops the step instead of publishing empty notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already has a release"; exit 0; fi
          version=${tag#vscode-v}
          bash scripts/release-notes.sh "$tag" vscode-v packages/vscode > "$RUNNER_TEMP/notes.md"
          # Pre-release while the version is 0.x (alpha).
          gh release create "$tag" "$RUNNER_TEMP/vsix/leggio-$version.vsix" --verify-tag --title "Leggio for VS Code $version" --notes-file "$RUNNER_TEMP/notes.md" $([[ $tag == vscode-v0.* ]] && echo --prerelease)
