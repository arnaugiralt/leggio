# A release is a vX.Y.Z tag on a commit that is on master. The tag runs the checks, moves the release branch to
# that commit (Workers Builds deploys release to leggio.compostela.dev), then publishes a GitHub release.
# Pushes to master only build the canary preview. Push one tag at a time: GitHub sends no event for more
# than three tags in one push.
name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
concurrency: release
jobs:
  # The checks Workers Builds runs, first: a commit that fails them gets neither a deploy nor a release.
  check:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # move release, create the GitHub release
    steps:
      # Actions are pinned to commits: this job holds a token that can write to the repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # all history and tags: the master check and the changelog need them
      # The tag reaches the scripts only as $GITHUB_REF_NAME, never pasted into them, so its characters can't run.
      - name: Move release to the tagged commit
        shell: bash
        run: |
          tag=$GITHUB_REF_NAME
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$tag is not a release tag (vX.Y.Z)"; exit 1; }
          sha=$(git rev-parse "$tag^{commit}")
          git merge-base --is-ancestor "$sha" origin/master || { echo "::error::$tag is not on master"; exit 1; }
          # Forward only: without --force the push fails unless release is behind the tag.
          git push origin "$sha:refs/heads/release"
      - name: Publish the GitHub release
        shell: bash # -eo pipefail: a failing git command stops the step instead of publishing empty notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already has a release"; exit 0; fi
          # The release before this one by version, among the release tags this commit contains.
          prev=$(git tag --merged "$tag^{commit}" --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | grep -B1 -x "$tag" | grep -vx "$tag" || true)
          range=${prev:+$prev..}$tag
          # One type's subjects, scoped (feat(ui):) and breaking (feat!:) ones too. @names go in code spans, so
          # publishing notifies nobody.
          list() { git log --reverse --format=%s "$range" | sed -nE "s/^$1(\([^)]*\))?!?: /- /p" | sed -E 's/@([A-Za-z0-9-]+)/`@\1`/g'; }
          feats=$(list feat)
          fixes=$(list fix)
          {
            if [ -n "$feats" ]; then printf '## Features\n%s\n\n' "$feats"; fi
            if [ -n "$fixes" ]; then printf '## Fixes\n%s\n\n' "$fixes"; fi
            if [ -n "$prev" ]; then echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$tag"; fi
          } > "$RUNNER_TEMP/notes.md"
          # Pre-release while the version is 0.x (alpha).
          gh release create "$tag" --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" $([[ $tag == v0.* ]] && echo --prerelease)
